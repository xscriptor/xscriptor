name: Contributions by organization

on:
  schedule:
    - cron: "0 0 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render contributions by organization
        run: node scripts/contributions-by-org.mjs
        env:
          TOKEN: ${{ secrets.METRICS_TOKEN }}
          LOGIN: xScriptor

      - name: Render most used languages (organizations snapshot)
        run: node scripts/languages-orgs.mjs
        env:
          TOKEN: ${{ secrets.METRICS_TOKEN }}
          LOGIN: xScriptor

      - name: Commit and push
        run: |
          git config user.name "xscriptor"
          git config user.email "xscriptor@users.noreply.github.com"
          git add contributions.by-org.svg languages.orgs.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: update contributions and languages cards"
            git push origin HEAD
          fi
